name: 🚀 Auto Promote (dev ➔ main)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote-dev-to-main:
    name: "Sync dev to main (Create or Update PR)"
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_PR_PAT || secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🚀 Create or Update Promotion PR
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AUTO_PR_PAT || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/promote-dev-to-main.mjs
