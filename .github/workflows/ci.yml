name: 🛡️ CI Pipeline — DevLab Shared

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint:
    if: github.event_name == 'pull_request'
    name: 🔍 Validate PR & Branch
    uses: yuvadevlab/.github/.github/workflows/reusable-pr-lint.yml@main

  validate-and-build:
    name: 🏗️ CI Validation & Build
    uses: yuvadevlab/.github/.github/workflows/reusable-ci.yml@main
    with:
      node-version: "22"
      setup-python: true
      run-tests: true
