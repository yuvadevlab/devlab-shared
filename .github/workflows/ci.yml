name: "CI Pipeline — DevLab Shared"

on:
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint:
    name: "📝 Lint PR & Branch"
    uses: yuvadevlab/.github/.github/workflows/reusable-pr-lint.yml@main
    if: github.event_name == 'pull_request'

  ci:
    name: "⚡ CI Pipeline"
    uses: yuvadevlab/.github/.github/workflows/reusable-ci.yml@main
    with:
      node-version: "22"
      setup-python: true
      run-tests: true
