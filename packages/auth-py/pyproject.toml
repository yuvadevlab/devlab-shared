[project]
name = "devlab-auth"
version = "0.2.0"
description = "Universal DevLab Authentication SDK for Python (RS256 JWKS & M2M API Keys with FastAPI guards)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yuvaraj Pattabi", email = "yuva.devlab@gmail.com" }
]
dependencies = [
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "fastapi>=0.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "B008",  # Allow Depends/Header in FastAPI argument defaults
]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
pretty = true
enable_error_code = ["deprecated"]

[[tool.mypy.overrides]]
module = "cachetools.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jwt.*"
ignore_missing_imports = true



[tool.pytest.ini_options]
filterwarnings = [
    "error::DeprecationWarning",
    "default::DeprecationWarning",
]
